[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "senior-design-project"
version = "0.1.0"
description = "Senior Design Project"
requires-python = ">=3.11"
dependencies = [
    "pyadi-iio",
    "pylibiio==0.25",
    "matplotlib",
]

readme = "README.md"

[project.scripts]
senior-design = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false
